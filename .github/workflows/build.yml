# Build the netboot files for both architectures on every push and pull request.
# Pushing a tag like v0.1.0 also publishes them as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# The token is read-only unless a job asks for more (only release does)
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Native runners for each architecture, so nothing is emulated
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # Actions are pinned to a commit, so a moved or hijacked tag can't change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes, so don't leave the token in .git/config
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - run: nix build .#netboot --print-build-logs
      # result is a folder of symlinks into /nix/store; -L copies the files they point to
      - run: |
          mkdir -p out
          cp -rL result/${{ matrix.arch }} out/
          cp -L result/haos.ipxe out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netboot-${{ matrix.arch }}
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to create the release
    steps:
      # Both artifacts unpack into one folder: haos.ipxe, x86_64/, arm64/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: netboot-*
          merge-multiple: true
          path: netboot
      - name: Package
        run: |
          cd netboot
          find . -type f ! -name SHA256SUMS | sed 's|^\./||' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          cd ..
          tar -czf "haos-netinstall-${GITHUB_REF_NAME}.tar.gz" netboot
          sha256sum "haos-netinstall-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.1.0-rc1) is a test release: mark it as a pre-release
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes $prerelease \
            "haos-netinstall-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS
